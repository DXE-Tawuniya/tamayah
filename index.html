<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tamayah | Website design options</title>
<meta name="theme-color" content="#F7F6F2">
<style>
  :root{--ink:#132028;--teal:#326B73;--mint:#80EABA;--paper:#F7F6F2;--soft:#43535A;--line:rgba(19,32,40,.12)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
  main{max-width:960px;margin:0 auto;padding:56px 20px}
  img{display:block;width:180px;height:auto}
  h1{font-weight:400;font-size:clamp(2rem,4vw,3rem);letter-spacing:-.02em;margin:40px 0 8px}
  p{color:var(--soft);margin:0 0 32px}
  ul{list-style:none;padding:0;margin:0;display:grid;gap:16px}
  a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 26px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:inherit;text-decoration:none;transition:box-shadow .2s}
  a:hover{box-shadow:inset 0 0 0 2px var(--teal)}
  a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  b{font-weight:500;font-size:1.15rem}
  small{display:block;color:var(--soft)}
  .new{flex:none;padding:4px 12px;border-radius:999px;background:var(--mint);font-size:.8rem;font-weight:500}
</style>
</head>
<body>
<main>
  <img src="tamayah-tawuniya-light-theme/assets/Tamayah_Logo_POS.png" width="2400" height="784" alt="Tamayah">
  <h1>Website design options</h1>
  <p>Choose a direction to review.</p>
  <ul>
    <li><a href="tamayah-tawuniya-light-theme/"><span><b>Tawuniya-aligned light option ("Lifeline")</b><small>Tawuniya brand system with Tamayah colours and logo. Uses the content from the dark option. EN / AR.</small></span><span class="new">New</span></a></li>
    <li><a href="tamayah-light-theme/option-3.html"><span><b>Light option 3</b><small>EN · <span lang="ar">العربية</span> version: option-3-ar.html</small></span></a></li>
    <li><a href="tamayah-dark-theme/"><span><b>Dark option</b><small>EN / AR</small></span></a></li>
  </ul>
</main>
</body>
</html>
